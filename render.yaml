services:
  - type: web
    name: auditdraft-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: auditdraft-db
          property: connectionString
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: auditdraft-db
    databaseName: auditdraft
    user: auditdraft
    plan: 0.1c-256mb
    region: oregon
