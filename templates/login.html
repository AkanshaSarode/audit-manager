{% extends "base.html" %}
{% block title %}Login - AuditDraft Assistant{% endblock %}
{% block content %}
<div class="card login-card p-4">
  <h3 class="mb-3 text-center">AuditDraft Assistant</h3>
  <p class="text-muted text-center">Query Framing & Document Formatting Bot</p>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input class="form-control" name="username" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Log In</button>
  </form>
  <p class="text-center mt-3">
    No account? <a href="{{ url_for('register') }}">Register here</a>
  </p>
</div>
{% endblock %}
